name: Build and smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debian-13:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 8
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cmake git libwebsockets-dev openssl python3
      - uses: actions/checkout@v6
      - name: Compile
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Check HTTP and HTTPS
        run: |
          python3 tests/smoke.py ./build/adminpanelaz-lws
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=localhost \
            -keyout "$RUNNER_TEMP/test.key" -out "$RUNNER_TEMP/test.crt"
          python3 tests/smoke.py ./build/adminpanelaz-lws \
            --tls-cert "$RUNNER_TEMP/test.crt" --tls-key "$RUNNER_TEMP/test.key"

  ubuntu-24-04:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Build release binary
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebsockets-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Check HTTP, HTTPS and 20 MiB cgroup limit
        run: |
          python3 tests/smoke.py ./build/adminpanelaz-lws
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=localhost \
            -keyout "$RUNNER_TEMP/test.key" -out "$RUNNER_TEMP/test.crt"
          python3 tests/smoke.py ./build/adminpanelaz-lws \
            --tls-cert "$RUNNER_TEMP/test.crt" --tls-key "$RUNNER_TEMP/test.key"
          python3 tests/memory_budget.py ./build/adminpanelaz-lws "$RUNNER_TEMP/test.crt" "$RUNNER_TEMP/test.key"
